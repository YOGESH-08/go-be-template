openapi: 3.0.0
info:
  title: Go Backend Template API
  version: 1.0.0
  description: API documentation for the VIT Club Board Go Backend Template.
servers:
  - url: http://localhost:8080
    description: Local development server
paths:
  /health:
    get:
      summary: Health check endpoint
      description: Check the health status of external services (PostgreSQL and Redis).
      responses:
        '200':
          description: All systems operational.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Health check completed"
                  data:
                    type: object
                    properties:
                      postgres:
                        type: string
                        example: "OK"
                      redis:
                        type: string
                        example: "OK"
        '503':
          description: One or more services are down.
